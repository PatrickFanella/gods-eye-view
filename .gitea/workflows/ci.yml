name: CI
'on':
  pull_request: {}
  push:
    branches:
    - main
permissions:
  contents: read
jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v6
      with:
        node-version: '24'
    - name: Install locked dependencies
      shell: bash
      run: npm ci
    - name: Run all calibrated unit tests
      shell: bash
      run: npm test
    - name: Build
      shell: bash
      run: npm run build
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      GEV_REQUIRE_ALLOCATION_GATE: '1'
